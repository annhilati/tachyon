[workspace]
name = "test-shader"
version = "0.1.0"
description = "Mojo 1.0 SPIR-V Test Shader"
authors = ["Annhilati"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
# No dependencies because we use the environment of the Mojo SDK for tasks

[tasks]
build = "cd ../tachyon-sdk-mojo && ~/.pixi/bin/pixi run mojo run cli.mojo ../test-shader-mojo/shader.mojo -o ../tachyon-mod/run/shaderpacks/shader"
dbuild = "cd ../tachyon-sdk-mojo && ~/.pixi/bin/pixi run mojo run cli.mojo ../test-shader-mojo/shader.mojo -o ../tachyon-mod/run/shaderpacks/shader --debug"