[workspace]
name = "tachyon-sdk"
version = "0.1.0"
description = "Tachyon Mojo SDK"
authors = ["Annhilati"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
mojo = ">=1.0.0"
llvm-spirv = ">=22.1.2,<23"
llvm = ">=22.1.8,<23"
llvm-tools = ">=22.1.8,<23"
spirv-tools = ">=2026.3,<2027"
glslang = ">=15.1.0"

[tasks]
build-compiler = "mojo build tachyon/_cli.mojo -o tachyon"
